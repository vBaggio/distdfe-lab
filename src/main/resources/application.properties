spring.application.name=distdfe-lab
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
# Explicit names preserve the environment contract, including underscores inside property names.
spike.cert-path=${SPIKE_CERT_PATH:}
spike.cert-senha=${SPIKE_CERT_SENHA:}
spike.cnpj=${SPIKE_CNPJ:}
spike.cuf-autor=${SPIKE_CUF_AUTOR:}
spike.ambiente=${SPIKE_AMBIENTE:1}
spike.data-dir=${SPIKE_DATA_DIR:./dados}
